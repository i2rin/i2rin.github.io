<header class="site-header">
  <div class="site-header__inner">
    <a class="site-header__brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>

    <button class="nav-toggle" aria-label="メニューを開く" aria-expanded="false" aria-controls="site-nav">
      <span></span><span></span><span></span>
    </button>

    <nav id="site-nav" class="site-nav">
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/about/' | relative_url }}">About</a>
      <a href="{{ '/works/' | relative_url }}">Works</a>
      <a href="{{ '/news/' | relative_url }}">News</a>
    </nav>
  </div>
</header>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    var toggle = document.querySelector('.nav-toggle');
    var nav = document.getElementById('site-nav');
    toggle.addEventListener('click', function () {
      var isOpen = nav.classList.toggle('is-open');
      toggle.setAttribute('aria-expanded', isOpen);
    });
  });
</script>
