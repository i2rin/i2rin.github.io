title: "Airin Fukuda"
description: "鑑賞者間の基盤化形成を促進する透過型情報提示システムについて研究をしています"
url: "https://i2rin.github.io"
baseurl: ""
lang: ja

author:
  name: "福田 愛琳"

markdown: kramdown
kramdown:
  input: GFM

permalink: pretty

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - todo.md
  - node_modules
  - vendor
