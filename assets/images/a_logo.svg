  </defs>
  <!-- Transparent background; gold loop is an abstract allusion to A. -->
  <path d="M 359 216 C 362 166 355 91 319 88 C 288 84 267 127 238 166 C 194 225 163 246 132 228 C 109 215 119 192 141 177 C 185 147 252 149 310 173 C 332 182 348 199 359 216"
