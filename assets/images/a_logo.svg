<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" role="img" aria-label="Glossy gold abstract A monogram logo">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#fff5ae"/>
      <stop offset="0.17" stop-color="#f8d76b"/>
      <stop offset="0.38" stop-color="#c58a1d"/>
      <stop offset="0.57" stop-color="#fff0a0"/>
      <stop offset="0.77" stop-color="#e5b33c"/>
      <stop offset="1" stop-color="#a66b0b"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="dot" cx="32%" cy="23%" r="75%">
      <stop offset="0" stop-color="#fffbd4"/>
