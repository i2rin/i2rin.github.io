  <!-- Soft specular glints for a polished metallic finish. -->
  <path d="M 137 188 C 151 176 170 167 192 163" fill="none" stroke="url(#shine)" stroke-width="7" stroke-linecap="round"/>
  <path d="M 292 113 C 303 99 311 97 319 99" fill="none" stroke="url(#shine)" stroke-width="7" stroke-linecap="round"/>
  <circle cx="409" cy="216" r="17" fill="url(#dot)"/>
  <ellipse cx="404" cy="210" rx="6" ry="3.5" transform="rotate(-30 404 210)" fill="#fffce6" opacity="0.8"/>
